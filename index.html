<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactics-RAG | 레알 마드리드 전술 분석 AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; height: 100dvh; }
        .chat-container { width: 100%; max-width: 600px; background-color: #1e293b; display: flex; flex-direction: column; height: 100vh; height: 100dvh; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { padding: 16px 20px; background-color: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .chat-header h1 { font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .status-badge { font-size: 0.75rem; padding: 4px 8px; background-color: #10b981; color: #ffffff; border-radius: 12px; font-weight: 600; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; flex-direction: column; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .message.user { align-self: flex-end; }
        .message.bot { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
        .user .bubble { background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 4px; }
        .bot .bubble { background-color: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; border: 1px solid #475569; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { padding: 8px 12px; background-color: transparent; color: #cbd5e1; border: 1px solid #475569; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
        .chip:hover { background-color: #334155; }
        .chat-input-area { padding: 16px; background-color: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 12px 16px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { padding: 12px 20px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>⚽ Tactics-RAG AI</h1>
            <span class="status-badge">2026-27 시즌 기준</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bubble">안녕하세요! 레알 마드리드 전술 분석 RAG 챗봇입니다. ⚽<br>선수 6명과 포메이션 문서를 바탕으로 답해요. 문서에 없는 내용은 지어내지 않고 모른다고 답해요.</div>
            </div>
            <div class="chips" id="chips">
                <button class="chip" type="button" data-q="레알의 기본 포메이션은?">레알의 기본 포메이션은?</button>
                <button class="chip" type="button" data-q="발베르데는 지금 어느 포지션이야?">발베르데는 지금 어느 포지션이야?</button>
                <button class="chip" type="button" data-q="벨링엄의 역할은 뭐야?">벨링엄의 역할은 뭐야?</button>
                <button class="chip" type="button" data-q="레알의 압박 방식은?">레알의 압박 방식은? (자료에 없는 질문)</button>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" maxlength="300" placeholder="예: 벨링엄 전술 역할 알려줘" onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        let msgCounter = 0;

        async function sendMessage(preset) {
            const input = document.getElementById('userInput');
            if (input.disabled) return; // 답변을 기다리는 중에는 중복 전송 방지

            const question = (typeof preset === 'string' ? preset : input.value).trim();
            if (!question) return;

            const sendBtn = document.getElementById('sendBtn');

            // 예시 질문 버튼은 첫 질문 이후 숨김
            document.getElementById('chips')?.remove();

            // 사용자 메시지 추가
            appendMessage('user', question);
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;

            // 로딩 메시지 (무료 서버는 잠들어 있으면 첫 응답이 느릴 수 있음)
            const loadingId = appendMessage('bot', '전술 데이터베이스 검색 중... (서버가 잠들어 있었다면 최대 1분 걸릴 수 있어요)');

            try {
                const response = await fetch('/ask-tactics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (response.ok) {
                    let sourceText = '';
                    if (data.sources && data.sources.length > 0) {
                        // 서버가 파일 단위 번호를 매겨 주므로, 답변 속 [번호]와 그대로 일치함
                        const sourceLines = data.sources.map(s => `[${s.no}] ${s.file}`);
                        sourceText = `\n\n📌 출처 목록:\n` + sourceLines.join('\n');
                    }
                    appendMessage('bot', data.answer + sourceText);
                } else {
                    const detail = typeof data.detail === 'string'
                        ? data.detail
                        : '질문이 너무 길거나 형식이 올바르지 않습니다. (300자 이내로 입력해 주세요)';
                    appendMessage('bot', '오류가 발생했습니다: ' + detail);
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage('bot', '서버와 통신하는 중 에러가 발생했습니다.');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const id = 'msg-' + (++msgCounter); // Date.now() 대신 카운터: 같은 밀리초에 id가 겹치는 문제 방지
            msgDiv.id = id;
            msgDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.innerText = text;

            msgDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        document.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', () => sendMessage(btn.dataset.q));
        });
    </script>
</body>
</html>
